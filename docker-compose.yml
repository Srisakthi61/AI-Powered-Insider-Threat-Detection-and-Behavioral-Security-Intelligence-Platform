version: '3.8'

# ==============================================================================
# ITBIS - Insider Threat Behavioral Intelligence System
# Multi-Container Production Docker Compose Configuration
# Services:
#   1. postgres (Relational DB - ACID metadata, users, employees, alerts, incidents)
#   2. mongo    (Document DB - High-throughput telemetry & behavioral baselines)
#   3. backend  (FastAPI Python 3.12 + ML Engine & UEBA Profiler)
#   4. frontend (Next.js 16 + React 19 + Tailwind CSS Dashboard)
# ==============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: itbis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-itbis}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itbis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itbis-network

  mongo:
    image: mongo:6.0
    container_name: itbis-mongo
    restart: always
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itbis-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itbis-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-itbis}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-itbis}
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DB: ${MONGODB_DB:-itbis}
      MONGODB_URL: mongodb://mongo:27017/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in environment or .env file}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-8}
      ALGORITHM: HS256
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - itbis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: itbis-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - itbis-network

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local

networks:
  itbis-network:
    driver: bridge
